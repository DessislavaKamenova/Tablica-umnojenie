<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таблица за умножение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f9ff;--grid:#d8e5f8;--ink:#1c2f6b;--muted:#5a6b95;--card:#ffffff;--line:#b9cdee;
  --accent:#e5484d;--ok:#16794e;--okbg:#d3f1e1;--bad:#b42323;--badbg:#fde0e0;
  --m1:#ffe2b0;--m2:#cfeedd;--m3:#8fd8b4;--btn:#1c2f6b;--btntx:#ffffff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1727;--grid:#1a2842;--ink:#d6e2ff;--muted:#93a4cc;--card:#17233b;--line:#2d4166;
    --accent:#ff6b6f;--ok:#7be0ae;--okbg:#17402f;--bad:#ff9b9b;--badbg:#4a2020;
    --m1:#5a4318;--m2:#1f4a39;--m3:#2f7a58;--btn:#d6e2ff;--btntx:#0f1727;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1727;--grid:#1a2842;--ink:#d6e2ff;--muted:#93a4cc;--card:#17233b;--line:#2d4166;
  --accent:#ff6b6f;--ok:#7be0ae;--okbg:#17402f;--bad:#ff9b9b;--badbg:#4a2020;
  --m1:#5a4318;--m2:#1f4a39;--m3:#2f7a58;--btn:#d6e2ff;--btntx:#0f1727;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;
  min-height:100vh;
}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:28px;font-weight:800;margin:6px 0 12px;letter-spacing:-.01em}
h2{font-size:18px;font-weight:800;margin:24px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;min-height:48px;border:2px solid var(--ink);background:var(--card);border-radius:12px;font-weight:800;font-size:17px}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btntx)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-width:46px;min-height:46px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-weight:800;font-size:18px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--btn);color:var(--btntx)}
.sheet{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:6px 14px}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px dashed var(--line);padding:9px 2px;font-size:24px;text-align:left}
.row:last-child{border-bottom:0}
.row b{font-weight:800;min-width:3ch;text-align:right}
.row.hid b{color:var(--muted)}
.tools{display:flex;gap:8px;margin-top:10px}
.btn{min-height:46px;padding:0 16px;border:2px solid var(--ink);background:var(--card);border-radius:12px;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid var(--line);border-radius:3px;vertical-align:-2px;margin-right:5px}
.gridwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:340px;background:var(--card);font-size:14px}
th,td{border:1px solid var(--line);text-align:center;padding:0;height:32px;min-width:30px}
th{background:var(--grid);font-weight:800}
td{cursor:pointer}
td.m1{background:var(--m1)}td.m2{background:var(--m2)}td.m3{background:var(--m3)}
tr.on td,tr.on th{border-top:2px solid var(--accent);border-bottom:2px solid var(--accent)}
.q{text-align:center;padding:18px 10px}
#qtext{font-size:52px;font-weight:800;letter-spacing:.02em}
#ans{min-height:68px;margin:8px auto;max-width:200px;border-bottom:4px solid var(--ink);font-size:48px;font-weight:800;line-height:64px}
#ans.good{color:var(--ok);background:var(--okbg);border-radius:10px 10px 0 0}
#ans.bad{color:var(--bad);background:var(--badbg);border-radius:10px 10px 0 0}
#msg{min-height:52px;font-size:20px;font-weight:800;padding-top:6px}
#msg .btn{margin-left:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.key{min-height:58px;border:2px solid var(--ink);background:var(--card);border-radius:12px;font-size:26px;font-weight:800}
.key.go{background:var(--btn);color:var(--btntx)}
.key:disabled{opacity:.45}
.score{display:flex;justify-content:space-between;margin-top:14px;font-size:16px;color:var(--muted)}
.score b{color:var(--ink)}
.fprog{display:flex;justify-content:space-between;color:var(--muted);font-size:16px;margin-bottom:10px;min-height:24px}
.fprog b{color:var(--ink)}
.card{display:block;width:100%;height:250px;perspective:900px;background:none;border:0;padding:0}
.inner{display:block;position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:2px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;font-size:68px;font-weight:800}
.face small{font-size:15px;font-weight:600;color:var(--muted);margin-top:14px}
.back{transform:rotateY(180deg);background:var(--okbg);color:var(--ok)}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fbtns .btn{min-height:60px;font-size:19px}
#fyes{background:var(--btn);color:var(--btntx)}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.key:active,.chip:active{transform:scale(.96)}}
</style>
</head>
<body>
<main>
  <h1>Таблица за умножение</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-flash" aria-selected="true">Карти</button>
    <button class="tab" role="tab" id="t-learn" aria-selected="false">Научи</button>
    <button class="tab" role="tab" id="t-practice" aria-selected="false">Тест</button>
  </div>

  <section id="flash">
    <div class="chips" id="fchips" aria-label="Кои таблици да са в тестето"></div>
    <div class="fprog" id="fprog"></div>
    <button class="card" id="card" aria-label="Обърни картата"><span class="inner"><span class="face front" id="cf"></span><span class="face back" id="cb"></span></span></button>
    <div class="fbtns" id="fbtns"><button class="btn" id="fno">Още го уча</button><button class="btn" id="fyes">Знам го</button></div>
    <div class="sheet q" id="fdone" hidden><div style="font-size:34px;font-weight:800">Браво!</div><p id="fmsg"></p><button class="btn" id="frestart">Започни отначало</button></div>
  </section>

  <section id="learn" hidden>
    <div class="chips" id="nchips" aria-label="Избери число"></div>
    <div class="sheet" id="rows"></div>
    <div class="tools"><button class="btn" id="cover">Скрий отговорите</button></div>
    <h2>Моят напредък</h2>
    <div class="legend">
      <span><i style="background:var(--card)"></i>Непробвано</span>
      <span><i style="background:var(--m1)"></i>Греша</span>
      <span><i style="background:var(--m2)"></i>Върви</span>
      <span><i style="background:var(--m3)"></i>Научено</span>
    </div>
    <div class="gridwrap"><table id="grid"></table></div>
  </section>

  <section id="practice" hidden>
    <div class="chips" id="tchips" aria-label="Кои таблици да се упражняват"></div>
    <div class="sheet q">
      <div id="qtext">?</div>
      <div id="ans" aria-live="polite"></div>
      <div id="msg"></div>
    </div>
    <div class="pad" id="pad"></div>
    <div class="score" id="score"></div>
    <div class="tools"><button class="btn" id="reset">Изтрий напредъка</button></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const N = Array.from({length:10}, (_, i) => i + 1);
let stats = {};
try { stats = JSON.parse(localStorage.getItem('mt-stats') || '{}'); } catch (e) { stats = {}; }
function save(){ try { localStorage.setItem('mt-stats', JSON.stringify(stats)); } catch (e) {} }
const key = (a, b) => Math.min(a, b) + 'x' + Math.max(a, b);
function lvl(a, b){
  const s = stats[key(a, b)];
  if (!s) return 0;
  const v = s.r - 2 * s.w;
  return v <= 0 ? 1 : v < 3 ? 2 : 3;
}
function chips(el, vals, isOn, onTap){
  el.innerHTML = vals.map(v => `<button class="chip" data-v="${v}" aria-pressed="${isOn(v)}">${v}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (b) onTap(+b.dataset.v); };
}

/* ---------- Научи ---------- */
let n = 2, covered = false;
function renderLearn(){
  chips($('#nchips'), N, v => v === n, v => { n = v; renderLearn(); });
  $('#rows').innerHTML = N.map(i =>
    `<button class="row ${covered ? 'hid' : ''}" data-i="${i}"><span>${n} × ${i} =</span><b>${covered ? '?' : n * i}</b></button>`).join('');
  $('#cover').textContent = covered ? 'Покажи отговорите' : 'Скрий отговорите';
  renderGrid();
}
$('#rows').onclick = e => {
  const r = e.target.closest('.row');
  if (r && r.classList.contains('hid')) { r.classList.remove('hid'); r.querySelector('b').textContent = n * (+r.dataset.i); }
};
$('#cover').onclick = () => { covered = !covered; renderLearn(); };
function renderGrid(){
  let h = '<tr><th>×</th>' + N.map(b => `<th>${b}</th>`).join('') + '</tr>';
  N.forEach(a => {
    h += `<tr class="${a === n ? 'on' : ''}"><th>${a}</th>` +
      N.map(b => `<td class="m${lvl(a, b)}" data-a="${a}">${a * b}</td>`).join('') + '</tr>';
  });
  $('#grid').innerHTML = h;
}
$('#grid').onclick = e => { const c = e.target.closest('td'); if (c) { n = +c.dataset.a; renderLearn(); } };

/* ---------- Упражнявай ---------- */
let sel = new Set([2,3,4,5,6,7,8,9,10]);
let cur = null, buf = '', phase = 'ask', ok = 0, tot = 0, streak = 0, last = '', timer = null;

function renderTChips(){
  chips($('#tchips'), N, v => sel.has(v), v => {
    if (sel.has(v)) { if (sel.size > 1) sel.delete(v); } else sel.add(v);
    renderTChips(); next();
  });
}
function pick(){
  const pool = [];
  for (const a of sel) for (const b of N) {
    if (key(a, b) === last && sel.size * 10 > 1) continue;
    const w = [3, 5, 2, 1][lvl(a, b)];
    for (let i = 0; i < w; i++) pool.push([a, b]);
  }
  const p = pool[Math.floor(Math.random() * pool.length)] || [2, 2];
  return Math.random() < .5 ? p : [p[1], p[0]];
}
function next(){
  clearTimeout(timer);
  cur = pick(); last = key(cur[0], cur[1]); buf = ''; phase = 'ask';
  $('#qtext').textContent = `${cur[0]} × ${cur[1]}`;
  $('#ans').textContent = ''; $('#ans').className = ''; $('#msg').textContent = '';
  renderScore();
}
function renderScore(){
  $('#score').innerHTML = `<span>Верни: <b>${ok}</b> от <b>${tot}</b></span><span>Серия: <b>${streak}</b></span>`;
}
function submit(){
  if (phase !== 'ask' || buf === '') return;
  const [a, b] = cur, right = +buf === a * b, k = key(a, b);
  const s = stats[k] || (stats[k] = { r: 0, w: 0 });
  tot++;
  if (right) { s.r++; ok++; streak++; $('#ans').className = 'good'; $('#msg').textContent = 'Точно!'; timer = setTimeout(next, 800); phase = 'done'; }
  else {
    s.w++; streak = 0; phase = 'fb'; $('#ans').className = 'bad';
    $('#msg').innerHTML = `${a} × ${b} = ${a * b} <button class="btn" id="nx">Напред</button>`;
    $('#nx').onclick = next;
  }
  save(); renderScore();
}
function press(v){
  if (phase !== 'ask') { if (v === 'go' && phase === 'fb') next(); return; }
  if (v === 'go') return submit();
  if (v === 'del') buf = buf.slice(0, -1);
  else if (buf.length < 3) buf += v;
  $('#ans').textContent = buf;
}
$('#pad').innerHTML = [1,2,3,4,5,6,7,8,9,'del',0,'go'].map(k =>
  `<button class="key ${k === 'go' ? 'go' : ''}" data-k="${k}" aria-label="${k === 'del' ? 'Изтрий' : k === 'go' ? 'Провери' : k}">${k === 'del' ? '⌫' : k === 'go' ? '✓' : k}</button>`).join('');
$('#pad').onclick = e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); };
document.addEventListener('keydown', e => {
  if ($('#practice').hidden || e.ctrlKey || e.metaKey) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('del');
  else if (e.key === 'Enter') press('go');
});
let armed = false;
$('#reset').onclick = () => {
  if (!armed) { armed = true; $('#reset').textContent = 'Сигурни ли сте? Натиснете пак'; setTimeout(() => { armed = false; $('#reset').textContent = 'Изтрий напредъка'; }, 3000); return; }
  stats = {}; save(); ok = tot = streak = 0; armed = false; $('#reset').textContent = 'Изтрий напредъка'; next(); renderLearn();
};

/* ---------- Табове ---------- */
/* ---------- Карти ---------- */
let fsel = new Set([2,3,4,5,6,7,8,9,10]), deck = [], fTotal = 0, fKnown = 0, flipped = false;
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderFChips(){
  chips($('#fchips'), N, v => fsel.has(v), v => {
    if (fsel.has(v)) { if (fsel.size > 1) fsel.delete(v); } else fsel.add(v);
    renderFChips(); buildDeck();
  });
}
function buildDeck(){
  const seen = new Set(), d = [];
  for (const a of fsel) for (const b of N) {
    const k = key(a, b); if (seen.has(k)) continue; seen.add(k);
    d.push(Math.random() < .5 ? [a, b] : [b, a]);
  }
  deck = shuffle(d); fTotal = deck.length; fKnown = 0; renderCard();
}
function renderCard(){
  const empty = !deck.length;
  flipped = false; $('#card').classList.remove('flip');
  $('#card').hidden = empty; $('#fbtns').hidden = empty; $('#fdone').hidden = !empty;
  $('#fbtns').style.visibility = 'hidden';
  $('#fmsg').textContent = `Знаеш всичките ${fTotal} карти от това тесте.`;
  $('#fprog').innerHTML = empty ? '' : `<span>Остават: <b>${deck.length}</b></span><span>Знам: <b>${fKnown}</b> от <b>${fTotal}</b></span>`;
  if (!empty) { const [a, b] = deck[0]; $('#cf').innerHTML = `${a} × ${b}<small>Докосни, за да обърнеш</small>`; $('#cb').textContent = a * b; }
}
function flip(){
  if (!deck.length) return;
  flipped = !flipped; $('#card').classList.toggle('flip', flipped);
  $('#fbtns').style.visibility = flipped ? 'visible' : 'hidden';
}
function rate(right){
  if (!flipped || !deck.length) return;
  const [a, b] = deck.shift(), k = key(a, b), s = stats[k] || (stats[k] = { r: 0, w: 0 });
  if (right) { s.r++; fKnown++; } else { s.w++; deck.splice(Math.min(deck.length, 3 + Math.floor(Math.random() * 3)), 0, [a, b]); }
  save(); flipped = false; $('#card').classList.remove('flip'); $('#fbtns').style.visibility = 'hidden';
  setTimeout(renderCard, 220);
}
$('#card').onclick = flip;
$('#fyes').onclick = () => rate(true);
$('#fno').onclick = () => rate(false);
$('#frestart').onclick = buildDeck;
document.addEventListener('keydown', e => {
  if ($('#flash').hidden) return;
  if (e.key === 'ArrowLeft') rate(false);
  else if (e.key === 'ArrowRight') rate(true);
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flip(); }
});

function show(w){
  clearTimeout(timer);
  for (const t of ['flash', 'learn', 'practice']) {
    $('#' + t).hidden = t !== w; $('#t-' + t).setAttribute('aria-selected', t === w);
  }
  if (w === 'flash') { renderFChips(); buildDeck(); }
  else if (w === 'practice') { renderTChips(); next(); }
  else renderLearn();
}
$('#t-flash').onclick = () => show('flash');
$('#t-learn').onclick = () => show('learn');
$('#t-practice').onclick = () => show('practice');
show('flash');
</script>
</body>
</html>
